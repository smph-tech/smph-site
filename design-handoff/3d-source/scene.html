<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const kind = q.get('s') || 'web';
const W = +q.get('w') || 1000, H = +q.get('h') || 1000;

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const key = new THREE.DirectionalLight(0xbcd0ff, 2.2); key.position.set(5,8,6); scene.add(key);
const rim = new THREE.DirectionalLight(0x8b5cff, 3.0); rim.position.set(-6,3,-5); scene.add(rim);
const fill = new THREE.PointLight(0x22d3ee, 40, 30); fill.position.set(4,-1,5); scene.add(fill);

const C = {navy:0x1a2b86, blue:0x2f5bff, blue2:0x4f7bff, violet:0x8b5cf6, cyan:0x1fc8ea, white:0xdde7ff, ink:0x070b24};
const gloss = (color, o={}) => new THREE.MeshPhysicalMaterial({color, roughness:o.r??0.22, metalness:o.m??0.15, clearcoat:1, clearcoatRoughness:0.08, ...o.extra});
const glow = (color, i=1.4) => new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:Math.min(i,1.0)*0.85, roughness:.4});
const rbox = (w,h,d,r,mat) => new THREE.Mesh(new RoundedBoxGeometry(w,h,d,5,r), mat);
const sph = (r,mat) => new THREE.Mesh(new THREE.SphereGeometry(r,48,48), mat);

function tex(draw, w=768, h=512){
  const c = document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); draw(x,w,h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function rr(x,a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);}
function uiDash(x,w,h){
  const g=x.createLinearGradient(0,0,w,h); g.addColorStop(0,'#0f1a58'); g.addColorStop(1,'#071033'); x.fillStyle=g; x.fillRect(0,0,w,h);
  x.fillStyle='rgba(255,255,255,.07)'; rr(x,28,28,150,h-56,18); x.fill();
  for(let i=0;i<4;i++){x.fillStyle=i==0?'#4f7bff':'rgba(255,255,255,.22)'; rr(x,46,60+i*46,100,14,7); x.fill();}
  x.fillStyle='rgba(255,255,255,.9)'; rr(x,206,32,220,22,11); x.fill();
  const cols=['#2f5bff','#8b5cf6','#22d3ee']; for(let i=0;i<3;i++){const gx=206+i*172; const gg=x.createLinearGradient(gx,90,gx+150,190); gg.addColorStop(0,cols[i]); gg.addColorStop(1,'rgba(255,255,255,.06)'); x.fillStyle=gg; rr(x,gx,88,150,104,18); x.fill();}
  x.fillStyle='rgba(255,255,255,.14)'; for(let i=0;i<4;i++){rr(x,206,220+i*34,i%2?380:470,12,6); x.fill();}
  x.strokeStyle='#22d3ee'; x.lineWidth=5; x.lineCap='round'; x.beginPath(); x.moveTo(560,420); x.lineTo(600,380); x.lineTo(640,396); x.lineTo(690,330); x.lineTo(730,300); x.stroke();
}
function uiPhone(x,w,h){
  const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'#1b2a8a'); g.addColorStop(1,'#080e33'); x.fillStyle=g; x.fillRect(0,0,w,h);
  x.fillStyle='rgba(255,255,255,.9)'; rr(x,40,60,160,24,12); x.fill();
  const cols=['#2f5bff','#8b5cf6','#22d3ee']; for(let i=0;i<3;i++){const gg=x.createLinearGradient(40,130+i*150,w-40,230+i*150); gg.addColorStop(0,cols[i]); gg.addColorStop(1,'rgba(255,255,255,.05)'); x.fillStyle=gg; rr(x,40,130+i*150,w-80,120,24); x.fill();}
  x.fillStyle='#eef3ff'; rr(x,70,h-120,w-140,64,32); x.fill();
}
function uiChart(x,w,h){
  const g=x.createLinearGradient(0,0,w,h); g.addColorStop(0,'#13206b'); g.addColorStop(1,'#080f36'); x.fillStyle=g; x.fillRect(0,0,w,h);
  x.fillStyle='rgba(255,255,255,.85)'; rr(x,34,30,130,18,9); x.fill();
  const bars=[.35,.5,.42,.65,.58,.85]; bars.forEach((b,i)=>{const bh=b*(h-150); const gg=x.createLinearGradient(0,h-60-bh,0,h-60); gg.addColorStop(0,'#22d3ee'); gg.addColorStop(1,'#2f5bff'); x.fillStyle=gg; rr(x,44+i*108,h-60-bh,70,bh,12); x.fill();});
}

const root = new THREE.Group(); scene.add(root);

function web(showCard=true){
  const g = new THREE.Group();
  g.add(rbox(3.6,2.5,.26,.14,gloss(C.navy,{m:.35,r:.18})));
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(3.3,2.2), new THREE.MeshBasicMaterial({map:tex(uiDash,768,512),toneMapped:false})); scr.position.z=.14; g.add(scr);
  const card = rbox(1.35,.9,.14,.1,gloss(C.white,{r:.12})); card.position.set(1.55,-.85,.75); if(showCard) g.add(card);
  const cm = new THREE.Group(); cm.position.set(1.55,-.85,.86);
  const s1 = rbox(.13,.3,.06,.05,glow(C.cyan,1.2)); s1.position.set(-.12,-.07,0); s1.rotation.z=.8; cm.add(s1);
  const s2 = rbox(.13,.58,.06,.05,glow(C.cyan,1.2)); s2.position.set(.08,.03,0); s2.rotation.z=-.8; cm.add(s2); if(showCard) g.add(cm);
  const o1 = sph(.2,glow(C.violet,1.3)); o1.position.set(-1.9,1.25,.7); g.add(o1);
  const o2 = sph(.11,glow(C.cyan,1.6)); o2.position.set(2.0,1.35,.4); g.add(o2);
  g.rotation.set(.14,-.5,-.02); return g;
}
function phone(){
  const g = new THREE.Group();
  g.add(rbox(1.7,3.4,.24,.26,gloss(C.navy,{m:.45,r:.15})));
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.5,3.15), new THREE.MeshBasicMaterial({map:tex(uiPhone,400,840),toneMapped:false})); scr.position.z=.13; g.add(scr);
  const pill = rbox(1.9,.46,.14,.2,gloss(C.white,{r:.1})); pill.position.set(.5,1.1,.7); g.add(pill);
  const dot = sph(.1,glow(C.cyan,1.7)); dot.position.set(-.2,1.1,.8); g.add(dot);
  const line = rbox(.95,.1,.05,.04,gloss(C.navy)); line.position.set(.5,1.1,.8); g.add(line);
  const o1 = sph(.18,glow(C.violet,1.3)); o1.position.set(-1.35,-.9,.6); g.add(o1);
  const o2 = sph(.09,glow(C.blue2,1.6)); o2.position.set(1.4,-1.2,.4); g.add(o2);
  g.rotation.set(.08,-.55,.1); return g;
}
function systems(){
  const g = new THREE.Group();
  [0,.72,1.44].forEach((y,i)=>{
    const d = new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.25,.56,96), gloss(i==2?C.blue:C.navy,{m:.4,r:.16}));
    d.position.y=y; g.add(d);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.255,.035,16,128), glow(i==1?C.violet:C.cyan,1.8)); ring.rotation.x=Math.PI/2; ring.position.y=y+.1; g.add(ring);
    const dot = sph(.07,glow(0xffffff,2)); dot.position.set(.78,y,1.0); g.add(dot);
  });
  const top = new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,.04,64), glow(C.cyan,1.1)); top.position.y=1.74; g.add(top);
  const card = rbox(1.9,1.2,.1,.1,gloss(C.white,{r:.1})); card.position.set(1.7,.9,.9); card.rotation.y=-.3; g.add(card);
  const sp = new THREE.Mesh(new THREE.PlaneGeometry(1.7,1.0), new THREE.MeshBasicMaterial({map:tex(uiChart,768,448),toneMapped:false})); sp.position.set(1.7,.9,.96); sp.rotation.y=-.3; g.add(sp);
  const o = sph(.16,glow(C.violet,1.4)); o.position.set(-1.8,1.5,.6); g.add(o);
  g.rotation.set(.12,-.4,0); g.position.y=-.8; return g;
}
function marketing(){
  const g = new THREE.Group();
  const base = rbox(5,.22,1.7,.1,gloss(C.navy,{m:.4})); base.position.y=-.2; g.add(base);
  const hs=[.9,1.45,1.95,2.65,3.5];
  hs.forEach((h,i)=>{
    const last = i==hs.length-1;
    const b = rbox(.7,h,.7,.16, last? glow(C.cyan,.9) : gloss(i%2?C.blue:C.blue2,{m:.25,r:.18}));
    b.position.set(-1.9+i*.95, h/2-.09, 0); g.add(b);
  });
  const a = new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,3.4,24), glow(0xffffff,1.6)); a.position.set(-.3,2.2,.9); a.rotation.z=-1.0; g.add(a);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(.24,.6,32), glow(0xffffff,1.6)); cone.position.set(1.4,3.3,.9); cone.rotation.z=-1.0; g.add(cone);
  const o = sph(.2,glow(C.violet,1.4)); o.position.set(-2.3,2.4,.6); g.add(o);
  const o2 = sph(.1,glow(C.cyan,1.8)); o2.position.set(2.6,1.2,.7); g.add(o2);
  g.rotation.set(.12,-.45,0); g.position.y=-1.3; return g;
}
function gearShape(R, r, teeth, hole){
  const s = new THREE.Shape(); const n=teeth*4;
  for(let i=0;i<=n;i++){
    const a=i/n*Math.PI*2; const t=i%4; const rad=(t==1||t==2)?R:r;
    const p=[Math.cos(a)*rad, Math.sin(a)*rad]; if(i==0) s.moveTo(...p); else s.lineTo(...p);
  }
  const h = new THREE.Path(); h.absarc(0,0,hole,0,Math.PI*2,true); s.holes.push(h); return s;
}
function gear(R,r,teeth,hole,depth,mat){
  const geo = new THREE.ExtrudeGeometry(gearShape(R,r,teeth,hole), {depth, bevelEnabled:true, bevelThickness:.06, bevelSize:.06, bevelSegments:4, curveSegments:48});
  geo.translate(0,0,-depth/2); return new THREE.Mesh(geo, mat);
}
function consulting(){
  const g = new THREE.Group();
  const g1 = gear(1.5,1.2,12,.5,.55,gloss(C.blue,{m:.5,r:.18})); g1.position.set(-.6,.3,0); g.add(g1);
  const g2 = gear(.95,.75,8,.3,.5,gloss(C.white,{m:.3,r:.2})); g2.position.set(1.55,-.55,0); g2.rotation.z=.2; g.add(g2);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.7,48), glow(C.cyan,1.5)); hub.rotation.x=Math.PI/2; hub.position.copy(g1.position); g.add(hub);
  const hub2 = new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.64,48), glow(C.violet,1.5)); hub2.rotation.x=Math.PI/2; hub2.position.copy(g2.position); g.add(hub2);
  const o = sph(.2,glow(C.violet,1.4)); o.position.set(-2.2,1.7,.6); g.add(o);
  const o2 = sph(.12,glow(C.cyan,1.8)); o2.position.set(2.3,1.2,.7); g.add(o2);
  const o3 = sph(.09,glow(0xffffff,2)); o3.position.set(.4,-1.9,.8); g.add(o3);
  g.rotation.set(.1,-.35,0); return g;
}
function hero(){
  const g = new THREE.Group();
  const plat = new THREE.Mesh(new THREE.CylinderGeometry(5,5.2,.3,128), new THREE.MeshStandardMaterial({color:0x0e1860,roughness:.65,metalness:.1,envMapIntensity:.2})); plat.position.y=-.2; g.add(plat);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(5.1,.05,16,200), glow(C.cyan,1.8)); ring.rotation.x=Math.PI/2; ring.position.y=-.03; g.add(ring);
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(3.6,.025,16,200), glow(C.violet,1.6)); ring2.rotation.x=Math.PI/2; ring2.position.y=-.03; g.add(ring2);
  const w = web(false); w.scale.setScalar(1.15); w.position.set(-.5,2.0,-1.1); w.rotation.set(.05,-.25,0); g.add(w);
  const p = phone(); p.scale.setScalar(.82); p.position.set(2.7,1.65,1.0); p.rotation.set(0,-.35,.04); g.add(p);
  const s = systems(); s.scale.setScalar(.52); s.position.set(-3.2,.95,1.4); s.rotation.y=.2; g.add(s);
  const hs=[.5,.85,1.2,1.65]; hs.forEach((h,i)=>{ const b=rbox(.5,h,.5,.12,i==3?glow(C.cyan,.9):gloss(C.blue2,{m:.25})); b.position.set(-.6+i*.72,h/2-.02,2.6); g.add(b); });
  [[-3.6,3.6,-1,.22,C.violet],[3.9,3.5,-1.5,.14,C.cyan],[0,4.6,1,.1,C.white],[-1.8,.5,3.2,.12,C.cyan],[4.4,.8,2.5,.16,C.violet]].forEach(([x,y,z,r,c])=>{const o=sph(r,glow(c,1.6)); o.position.set(x,y,z); g.add(o);});
  g.position.y=-1.1; return g;
}

const builders = {web,phone,systems,marketing,consulting,hero};
root.add(builders[kind]());
const cam = new THREE.PerspectiveCamera(kind==='hero'?28:30, W/H, .1, 100);
if(kind==='hero'){ cam.position.set(12.5,10.2,21); cam.lookAt(0,.6,0); }
else { cam.position.set(0,0,10.5); cam.lookAt(0,0,0); }
renderer.render(scene, cam);
window.__done = true;
</script></body></html>
